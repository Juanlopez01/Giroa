<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body{background:var(--cream);color:var(--ink)}
.top{display:flex;justify-content:space-between;align-items:center}
.tag{font-weight:600;font-size:30px;letter-spacing:.14em;text-transform:uppercase;color:var(--wine)}
h1{font-size:118px;line-height:1.02;font-weight:600;letter-spacing:-.012em;margin-top:120px;color:var(--wine)}
h1 em{font-style:italic;font-weight:500;position:relative;white-space:nowrap}
h1 em::after{content:"";position:absolute;left:-2%;right:-2%;bottom:.12em;height:.16em;background:var(--gold);opacity:.55;z-index:-1;border-radius:4px}
ul{list-style:none;margin-top:90px;display:flex;flex-direction:column;gap:26px}
li{display:flex;align-items:center;gap:28px;background:var(--paper);border:2px solid #e8dccd;border-radius:28px;padding:30px 36px;font-size:40px;font-weight:500;line-height:1.2}
li b{flex:none;width:58px;height:58px;border-radius:50%;background:#f3e3e3;color:#b4323c;display:grid;place-items:center;font-size:34px;font-weight:700}
.swipe{margin-top:auto;align-self:flex-end;display:flex;align-items:center;gap:18px;font-size:38px;font-weight:600;color:var(--wine)}
.swipe span{width:84px;height:84px;border-radius:50%;background:var(--wine);color:var(--paper);display:grid;place-items:center;font-size:44px}
.dots{color:var(--wine)}
</style></head><body><div class="slide">
<div class="top"><span class="tag">Para estudios de danza</span><span class="logo" style="font-size:56px;color:var(--wine)">gir<span class="o"></span>a</span></div>
<h1 class="serif">¿Todavía anotás las clases en un <em>cuaderno?</em></h1>
<ul>
<li><b>✕</b>Packs vencidos que nadie controla</li>
<li><b>✕</b>“Profe, ¡yo ya te pagué!”</li>
<li><b>✕</b>12 líderes y 4 seguidores</li>
<li><b>✕</b>Reservas perdidas en WhatsApp</li>
</ul>
<div class="swipe">Hay otra forma <span>→</span></div>
<div class="dots"><i class="on"></i><i></i></div>
</div></body></html>
